spring.application.name=db-arena

spring.datasource.url=${DB_ARENA_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db-arena}
spring.datasource.username=${DB_ARENA_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_ARENA_DATASOURCE_PASSWORD:postgres}

spring.data.redis.host=${DB_ARENA_REDIS_HOST:localhost}
spring.data.redis.port=${DB_ARENA_REDIS_PORT:6379}

app.frontend-origin=${DB_ARENA_FRONTEND_ORIGIN:http://localhost:4200}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO

spring.jpa.hibernate.ddl-auto=${DB_ARENA_JPA_DDL_AUTO:update}

jwt.secret=${DB_ARENA_JWT_SECRET:db-arena-local-dev-secret-change-me}
jwt.expiration=${DB_ARENA_JWT_EXPIRATION:100000000}
